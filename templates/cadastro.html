<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar aluno</title>
  </head>
  <body>
    <nav>
      <a href="{{url_for('inicio')}}">Inicio</a>
      <a href="{{url_for('consultar_alunos')}}">Consultar</a>
    </nav>
    <h1>Cadastrar aluno</h1>
    {% if erro %}
    <p role="alert"><strong>{{erro}}</strong></p>
    {% endif %}
    <form action="{{url_for('cadastrar_aluno')}}" method="post">
      <p>
        <label for="nome">Nome *</label><br />
        <input
          id="nome"
          name="nome"
          type="text"
          maxlength="100"
          value="{{dados.get('nome', '')}}"
          required
        />
      </p>
      <p>
        <label for="email">E-mail *</label><br />
        <input
          id="email"
          name="email"
          type="email"
          maxlength="120"
          value="{{dados.get('email', '')}}"
          required
        />
      </p>
      <p>
        <label for="telefone">Telefone *</label></br>
        <input 
        id="telefone"
        name="telefone"
        type="tel"
        maxlength="20"
        value="{{dados.get('telefone', '')}}"
        >
      </p>
      <button type="submit">Cadastrar aluno</button>

    </form>
  </body>
</html>
